name: Latest Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-build
  cancel-in-progress: true

jobs:
  build:
    name: Build & publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        id: collect
        run: |
          mkdir -p artifacts
          apk=$(find app/build/outputs/apk -name "*.apk" -print -quit)
          if [ -z "$apk" ]; then
            echo "No APK was produced." >&2
            exit 1
          fi
          short_sha="${GITHUB_SHA::7}"
          dest="artifacts/LibreTune-latest-${short_sha}.apk"
          cp "$apk" "$dest"
          echo "apk_path=$dest" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Delete previous "latest-build" release
        run: gh release delete latest-build --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to "Latest build" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build
          body: |
            Automated build from `${{ github.ref_name }}` @ `${{ steps.collect.outputs.short_sha }}`.

            This release is updated on every push to the default branch and
            always points to the most recent successful build.
          prerelease: true
          make_latest: false
          files: ${{ steps.collect.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
