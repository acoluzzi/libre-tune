name: CI/CD Build and Publish

on:
  push:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-client-android:
    name: Build Client Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        working-directory: .
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ./app/build/outputs/apk/release/*.apk

      - name: Prepare Pages bundle
        run: |
          mkdir -p pages
          apk_path=$(find ./app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          cp "$apk_path" ./pages/latest.apk
          cat <<EOF > ./pages/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>LibreTune Latest APK</title>
          </head>
          <body>
            <h1>LibreTune Latest APK</h1>
            <p><a href="./latest.apk">Download latest.apk</a></p>
            <p>Commit: ${{ github.sha }}</p>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages

  deploy-client-pages:
    name: Publish Client APK Page
    needs:
      - build-client-android
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
