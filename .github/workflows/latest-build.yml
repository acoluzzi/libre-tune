name: Latest Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: latest-build
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./mobile/gradlew

      - name: Build debug APK
        working-directory: mobile
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        id: collect
        run: |
          mkdir -p artifacts
          apk=$(find mobile/app/build/outputs/apk -name "*.apk" -print -quit)
          if [ -z "$apk" ]; then
            echo "No APK was produced." >&2
            exit 1
          fi
          short_sha="${GITHUB_SHA::7}"
          dest="artifacts/LibreTune-latest-${short_sha}.apk"
          cp "$apk" "$dest"
          echo "apk_path=$dest" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibreTune-latest-${{ steps.collect.outputs.short_sha }}
          path: ${{ steps.collect.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 90
