services:
  db:
    image: postgres:15-alpine
    container_name: libretune-db-dev
    restart: unless-stopped
    environment:
      - POSTGRES_DB=libretune_db
      - POSTGRES_USER=libretune_user
      - POSTGRES_PASSWORD=change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
