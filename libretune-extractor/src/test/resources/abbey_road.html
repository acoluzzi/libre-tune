-up in April 1970. It was mostly recorded in April, July, and August 1969, and topped the record charts in both the United States and the United Kingdom. A double A-side single from the album, \\\x22Something\\\x22 \/ \\\x22Come Together\\\x22, was released in October, which also topped the charts in the US.\\nAbbey Road incorporates styles such as rock, pop, blues, and progressive rock, and makes prominent use of the Moog synthesiser and guitar played through a Leslie speaker unit. It is also notable for having a long medley of songs on side two that have subsequently been covered as one suite by other notable artists. The album was recorded in a more collegial atmosphere than the Get Back \/ Let It Be sessions earlier in the year, but there were still significant confrontations within the band, particularly over Paul McCartney\x27s song \\\x22Maxwell\x27s Silver Hammer\\\x22, and John Lennon did not perform on several tracks.\x22,\x22thumbnail\x22:\x7b\x22thumbnails\x22:\x5b\x7b\x22url\x22:\x22https:\/\/lh3.googleusercontent.com\/g8bzAg2zxvdnm7ismLMYLA9-9azb4y6VP2uOF56A2G2rpsqLHT6mrJWXRKq_VttXQZ-o-jmVgTFIVgdj\x3dw544-h544-l90-rj\x22,\x22width\x22:544,\x22height\x22:544\x7d\x5d\x7d,\x22siteName\x22:\x22YouTube Music\x22,\x22appName\x22:\x22YouTube Music\x22,\x22androidPackage\x22:\x22com.google.android.apps.youtube.music\x22,\x22iosAppStoreId\x22:\x221017492454\x22,\x22ogType\x22:\x22music.album\x22,\x22urlApplinksWeb\x22:\x22https:\/\/music.youtube.com\/playlist?list\x3dOLAK5uy_lqcFZTOPHGwcnP0nYMzNuY0IES0fl7Fe4\\u0026feature\x3dapplinks\x22,\x22urlApplinksIos\x22:\x22vnd.youtube.music:\/\/music.youtube.com\/playlist?list\x3dOLAK5uy_lqcFZTOPHGwcnP0nYMzNuY0IES0fl7Fe4\\u0026feature\x3dapplinks\x22,\x22urlApplinksAndroid\x22:\x22vnd.youtube.music:\/\/music.youtube.com\/playlist?list\x3dOLAK5uy_lqcFZTOPHGwcnP0nYMzNuY0IES0fl7Fe4\\u0026feature\x3dapplinks\x22,\x22urlTwitterIos\x22:\x22vnd.youtube.music:\/\/music.youtube.com\/playlist?list\x3dOLAK5uy_lqcFZTOPHGwcnP0nYMzNu
