 il primo del gruppo registrato con il bassista Robert Trujillo, oltre ad essere il primo prodotto da Rick Rubin, dopo che il suo predecessore Bob Rock, già bassista nel disco precedente, aveva prodotto gli album del gruppo dall\x27album omonimo fino a St. Anger. L\x27album, rispetto al suo predecessore, presenta composizioni musicali più complesse, assoli di chitarra sia da parte di Kirk Hammett che di James Hetfield e segna un ritorno alle radici thrash metal dei Metallica. Il disco è stato generalmente accolto in maniera positiva dai fan e dalla critica specializzata, ma ha ricevuto alcune critiche riguardo l\x27elevata compressione del livello audio.\\nDeath Magnetic è diventato il quinto album consecutivo dei Metallica ad aver debuttato al primo posto della classifica statunitense Billboard 200, rendendoli la prima band di sempre capace di ottenere questo risultato.\\n\\nDa Wikipedia (\x22\x7d,\x7b\x22text\x22:\x22https:\/\/it.wikipedia.org\/wiki\/Death_M...\x22,\x22navigationEndpoint\x22:\x7b\x22clickTrackingParams\x22:\x22CAUQiPgDIhMIl-rIpratjwMVKOhPCB1dCyiq\x22,\x22urlEndpoint\x22:\x7b\x22url\x22:\x22https:\/\/it.wikipedia.org\/wiki\/Death_Magnetic\x22,\x22target\x22:\x22TARGET_NEW_WINDOW\x22\x7d\x7d\x7d,\x7b\x22text\x22:\x22) soggetto a Creative Commons Attribution CC-BY-SA 3.0 (\x22\x7d,\x7b\x22text\x22:\x22https:\/\/creativecommons.org\/licenses\/...\x22,\x22navigationEndpoint\x22:\x7b\x22clickTrackingParams\x22:\x22CAUQiPgDIhMIl-rIpratjwMVKOhPCB1dCyiq\x22,\x22urlEndpoint\x22:\x7b\x22url\x22:\x22https:\/\/creativecommons.org\/licenses\/by-sa\/3.0\/legalcode\x22,\x22target\x22:\x22TARGET_NEW_WINDOW\x22\x7d\x7d\x7d,\x7b\x22text\x22:\x22)\x22\x7d\x5d\x7d,\x22moreButton\x22:\x7b\x22toggleButtonRenderer\x22:\x7b\x22isToggled\x22:false,\x22isDisabled\x22:false,\x22defaultIcon\x22:\x7b\x22iconType\x22:\x22EXPAND\x22\x7d,\x22defaultText\x22:\x7b\x22runs\x22:\x5b\x7b\x22text\x22:\x22Altro\x22\x7d\x5d\x7d,\x22toggledIcon\x22:\x7b\x22iconType\x22:\x22COLLAPSE\x22\x7
